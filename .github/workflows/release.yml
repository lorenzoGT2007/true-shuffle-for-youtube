# Push a tag like v1.0.1 (matching "version" in manifest.json) and this builds the store zip
# and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches manifest.json
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest.json version $version"
            exit 1
          fi

      - name: Build the zip
        run: git archive --format=zip -o "true-shuffle-for-youtube-$GITHUB_REF_NAME.zip" HEAD manifest.json icons popup src

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "true-shuffle-for-youtube-$GITHUB_REF_NAME.zip" --title "True Shuffle $GITHUB_REF_NAME" --generate-notes
